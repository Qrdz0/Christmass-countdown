
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to Christmas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --accent: #e11d48; /* Classic Christmas Red */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* CSS Candy Cane Borders */
        .candy-stripe-top, .candy-stripe-bottom {
            position: absolute;
            width: 100%;
            height: 24px;
            background: repeating-linear-gradient(
                45deg,
                var(--accent),
                var(--accent) 15px,
                #ffffff 15px,
                #ffffff 30px
            );
            z-index: 10;
        }

        .candy-stripe-top {
            top: 0;
            border-bottom: 4px solid var(--bg);
        }

        .candy-stripe-bottom {
            bottom: 0;
            border-top: 4px solid var(--bg);
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 3rem;
            letter-spacing: 2px;
        }

        h1 span {
            color: var(--accent);
        }

        .countdown {
            display: flex;
            gap: 3rem;
            align-items: baseline;
        }

        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }

        .time-value {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            color: var(--text-main);
        }

        .time-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-top: 1rem;
            font-weight: 600;
        }

        /* Highlight the seconds in red */
        .time-block:last-child .time-value {
            color: var(--accent);
            text-shadow: 0 0 20px rgba(225, 29, 72, 0.4);
        }

        .music-player {
            position: fixed;
            bottom: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-player:hover {
            background: var(--text-main);
            border-color: var(--text-main);
        }

        .music-player:hover .music-text, .music-player:hover .music-icon {
            fill: var(--bg);
            color: var(--bg);
        }

        .music-icon {
            width: 16px;
            height: 16px;
            fill: var(--accent);
            transition: fill 0.3s;
        }

        .music-text {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            transition: color 0.3s;
        }

        .footer {
            position: fixed;
            bottom: 40px;
            right: 20px;
            font-size: 10px;
            color: #525252;
            font-family: 'Inter', sans-serif;
        }

        @media (max-width: 768px) {
            .countdown {
                flex-wrap: wrap;
                justify-content: center;
                gap: 2rem;
            }
            .time-block {
                min-width: 80px;
            }
            .time-value {
                font-size: 4rem;
            }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="candy-stripe-top"></div>

    <div class="container">
        <h1>Until <span>Christmas</span></h1>
        
        <div class="countdown">
            <div class="time-block">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-block">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-block">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-block">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>
    </div>

    <div class="music-player" id="music-btn" onclick="toggleMusic()">
        <svg class="music-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
        <span class="music-text" id="music-text">Play Music</span>
    </div>

    <div class="candy-stripe-bottom"></div>
    <div class="footer">&copy; 2026 VibeCode Labs.</div>

    <!-- Reliable Audio Source -->
    <audio id="bg-music" loop>
        <source src="https://archive.org/download/78_jingle-bells_fred-waring-and-his-pennsylvanians-bob-crosby-george-wyle_01-18-1927/Jingle%20Bells.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        // --- COUNTDOWN LOGIC ---
        const currentYear = new Date().getFullYear();
        let targetDate = new Date(`December 25, ${currentYear} 00:00:00`).getTime();

        if (new Date().getTime() > targetDate) {
            targetDate = new Date(`December 25, ${currentYear + 1} 00:00:00`).getTime();
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.querySelector('.container').innerHTML = "<h1>Merry Christmas.</h1>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // --- MUSIC LOGIC ---
        const audio = document.getElementById('bg-music');
        const musicText = document.getElementById('music-text');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                musicText.innerText = "Play Music";
            } else {
                audio.volume = 0;
                // Play the audio
                let playPromise = audio.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(_ => {
                        // Fade in volume smoothly
                        let vol = 0;
                        const fadeAudio = setInterval(() => {
                            if (vol < 0.4) { // Cap volume at 40%
                                vol += 0.05;
                                audio.volume = vol;
                            } else {
                                clearInterval(fadeAudio);
                            }
                        }, 200);
                        musicText.innerText = "Pause Music";
                    }).catch(error => {
                        console.log("Audio play failed:", error);
                        musicText.innerText = "Audio Error";
                    });
                }
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
