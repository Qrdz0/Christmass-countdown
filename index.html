<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Countdown</title>
<meta name="description" content="Days, hours, minutes and seconds until Christmas morning.">
<meta name="theme-color" content="#0c0b0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0b0b;
    --surface: #171515;
    --paper: #f3efe9;
    --text: #f3efe9;
    --text-2: #b9b2ac;
    --muted: #8a8380;
    --hairline: rgba(243, 239, 233, 0.08);
    --red: #c8161d;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --stripe: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Candy cane bands */
  .cane {
    position: fixed;
    left: 0;
    right: 0;
    height: var(--stripe);
    z-index: 2;
    background: repeating-linear-gradient(-45deg, var(--red) 0 8px, var(--paper) 8px 16px);
    opacity: 0.55;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
    pointer-events: none;
  }
  .cane--top { top: 0; }
  .cane--bottom { bottom: 0; }

  #snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  main {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 64px 16px 144px;
  }

  /* Countdown and reveal share one cell so they crossfade without a jump */
  .stage {
    display: grid;
    width: 100%;
    max-width: 1200px;
  }
  .stage > * {
    grid-area: 1 / 1;
    transition: opacity 900ms var(--ease), transform 900ms var(--ease), visibility 0s linear 900ms;
  }

  .countdown { text-align: center; }

  .date {
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--muted);
  }

  h1 {
    margin: 0 0 48px;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.25rem, 5vw, 3.5rem);
    line-height: 1.08;
    letter-spacing: -0.02em;
  }

  .units {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 32px 16px;
    margin: 0;
    padding: 32px 0;
    /* Faint dark pool so the digits sit clear of the snow */
    background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(0, 0, 0, 0.65), transparent 75%);
  }

  .unit { display: flex; flex-direction: column; align-items: center; gap: 8px; }

  .num {
    font-weight: 200;
    font-size: clamp(4.5rem, 22vw, 9.5rem);
    line-height: 1;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    text-shadow: 0 2px 32px rgba(0, 0, 0, 0.7);
  }

  .label {
    font-size: 14px;
    color: var(--muted);
  }

  @media (min-width: 768px) {
    .units { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
    .num { font-size: clamp(4.5rem, 10.5vw, 9.5rem); }
    .unit + .unit { border-left: 1px solid var(--hairline); }
  }

  /* Christmas Day reveal */
  .reveal {
    text-align: center;
    align-self: center;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
  }
  .reveal h2 {
    display: inline-block;
    position: relative;
    margin: 0;
    padding-bottom: 20px;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(3rem, 11vw, 8rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .reveal h2::after {
    content: "";
    position: absolute;
    left: 30%;
    right: 30%;
    bottom: 0;
    height: 2px;
    background: var(--red);
    transform: scaleX(0);
    transition: transform 1200ms var(--ease) 700ms;
  }
  .reveal p { margin: 24px 0 0; font-size: 16px; color: var(--text-2); }

  body.is-christmas .countdown { opacity: 0; visibility: hidden; transform: translateY(-8px); }
  body.is-christmas .reveal {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition-delay: 200ms, 200ms, 0s;
  }
  body.is-christmas .reveal h2::after { transform: scaleX(1); }

  /* Music dock */
  .dock {
    position: fixed;
    z-index: 3;
    left: 50%;
    bottom: calc(var(--stripe) + 20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(100% - 32px, 360px);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }

  .btn {
    flex: none;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    transition: background-color 160ms var(--ease), transform 120ms var(--ease);
  }
  .btn:active { transform: scale(0.94); }
  .btn:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
  .btn svg { width: 18px; height: 18px; }

  .btn--play { background: var(--paper); color: var(--bg); }
  .btn--play:hover { background: #fff; }
  .btn--play .i-pause, .dock[data-playing] .btn--play .i-play { display: none; }
  .dock[data-playing] .btn--play .i-pause { display: block; }

  .btn--next { background: transparent; color: var(--text-2); }
  .btn--next:hover { background: rgba(243, 239, 233, 0.06); color: var(--text); }

  .track { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .note { flex: none; width: 16px; height: 16px; color: var(--muted); transition: color 300ms var(--ease); }
  .dock[data-playing] .note { color: var(--red); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.12); }
  }

  .track-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .track-title, .track-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-title { font-size: 14px; font-weight: 500; }
  .track-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    .stage > *, .reveal h2::after { transition-duration: 0s; transition-delay: 0s; }
    .dock[data-playing] .note { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="cane cane--top" aria-hidden="true"></div>
  <canvas id="snow" aria-hidden="true"></canvas>

  <main>
    <div class="stage">
      <section class="countdown" aria-labelledby="title">
        <p class="date" id="date"></p>
        <h1 id="title">Until Christmas morning</h1>
        <div class="units" role="timer">
          <div class="unit"><span class="num" id="d">0</span><span class="label">Days</span></div>
          <div class="unit"><span class="num" id="h">00</span><span class="label">Hours</span></div>
          <div class="unit"><span class="num" id="m">00</span><span class="label">Minutes</span></div>
          <div class="unit"><span class="num" id="s">00</span><span class="label">Seconds</span></div>
        </div>
      </section>

      <section class="reveal" aria-live="polite">
        <h2>Merry Christmas</h2>
        <p id="reveal-date"></p>
      </section>
    </div>
  </main>

  <div class="dock" id="dock" role="region" aria-label="Music player">
    <button class="btn btn--play" id="play" type="button" aria-label="Play music">
      <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <div class="track">
      <svg class="note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <div class="track-text">
        <span class="track-title" id="track-title"></span>
        <span class="track-meta" id="track-meta"></span>
      </div>
    </div>
    <button class="btn btn--next" id="next" type="button" aria-label="Next track">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </button>
  </div>
  <audio id="audio" preload="metadata"></audio>

  <div class="cane cane--bottom" aria-hidden="true"></div>

<script>
(() => {
  const TRACKS = [
    { title: 'Last Christmas (slowed)', src: 'last_christmas.mp3' },
    { title: 'All I Want for Christmas (slowed)', src: 'all_i_want.mp3' },
  ];
  const VOLUME = 0.6;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Countdown ---------- */

  // ?at=2026-12-24T23:59:50 previews the countdown from another moment
  const at = Date.parse(new URLSearchParams(location.search).get('at'));
  const offset = Number.isNaN(at) ? 0 : at - Date.now();
  const now = () => new Date(Date.now() + offset);

  // Christmas Day itself shows the reveal; from 26 December it counts to next year
  const targetFor = (d) => {
    const y = d.getFullYear();
    const xmas = new Date(y, 11, 25);
    if (d < xmas) return { target: xmas, isChristmas: false };
    if (d < new Date(y, 11, 26)) return { target: xmas, isChristmas: true };
    return { target: new Date(y + 1, 11, 25), isChristmas: false };
  };
  console.assert(!targetFor(new Date(2026, 11, 24, 23, 59)).isChristmas, 'Dec 24 counts down');
  console.assert(targetFor(new Date(2026, 11, 25, 12)).isChristmas, 'Dec 25 reveals');
  console.assert(targetFor(new Date(2026, 11, 26)).target.getFullYear() === 2027, 'Dec 26 rolls over');

  const el = (id) => document.getElementById(id);
  const [dEl, hEl, mEl, sEl] = ['d', 'h', 'm', 's'].map(el);
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  const tick = () => {
    const t = now();
    const { target, isChristmas } = targetFor(t);
    document.body.classList.toggle('is-christmas', isChristmas);
    el('date').textContent = fmt(target);
    el('reveal-date').textContent = fmt(target);

    const left = Math.max(0, Math.floor((target - t) / 1000));
    dEl.textContent = Math.floor(left / 86400);
    hEl.textContent = pad(Math.floor(left / 3600) % 24);
    mEl.textContent = pad(Math.floor(left / 60) % 60);
    sEl.textContent = pad(left % 60);

    setTimeout(tick, 1000 - (t.getTime() % 1000) + 5); // land just after each second boundary
  };
  tick();

  /* ---------- Snow ---------- */

  const canvas = el('snow');
  const ctx = canvas.getContext('2d');
  let flakes = [];
  let w = 0, h = 0;

  const makeFlake = (y) => ({
    x: Math.random() * w,
    y: y ?? Math.random() * h,
    r: 0.6 + Math.random() * 1.4,
    vy: 0.15 + Math.random() * 0.35,
    sway: Math.random() * Math.PI * 2,
    a: 0.25 + Math.random() * 0.5,
  });

  const resize = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.min(50, Math.round(w / 28));
    flakes = Array.from({ length: count }, () => makeFlake());
    if (reduceMotion) draw();
  };

  const draw = () => {
    ctx.clearRect(0, 0, w, h);
    for (const f of flakes) {
      ctx.globalAlpha = f.a;
      ctx.fillStyle = f.r > 1.4 ? '#ffffff' : '#c9c4c0';
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  const frame = () => {
    for (const f of flakes) {
      f.sway += 0.006;
      f.y += f.vy;
      f.x += Math.sin(f.sway) * 0.2;
      if (f.y > h + 4) Object.assign(f, makeFlake(-4));
    }
    draw();
    requestAnimationFrame(frame);
  };

  addEventListener('resize', resize);
  resize();
  if (!reduceMotion) requestAnimationFrame(frame);

  /* ---------- Music ---------- */

  const audio = el('audio');
  const dock = el('dock');
  const playBtn = el('play');
  let index = 0;
  let playing = false;
  let fadeId = 0;

  // Interpolates in sqrt space so the fade sounds even to the ear, not just to the meter
  const fadeTo = (target, ms) => new Promise((resolve) => {
    const id = ++fadeId;
    const from = Math.sqrt(audio.volume), to = Math.sqrt(target);
    const start = performance.now();
    const step = (t) => {
      if (id !== fadeId) return resolve(false);
      const p = Math.min(1, (t - start) / ms);
      const e = p * p * (3 - 2 * p);
      audio.volume = (from + (to - from) * e) ** 2;
      p < 1 ? requestAnimationFrame(step) : resolve(true);
    };
    requestAnimationFrame(step);
  });

  const render = (meta) => {
    el('track-title').textContent = TRACKS[index].title;
    el('track-meta').textContent = meta ?? `${index + 1} of ${TRACKS.length}`;
    dock.toggleAttribute('data-playing', playing);
    playBtn.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
  };

  const load = () => { audio.src = TRACKS[index].src; };

  const play = async () => {
    playing = true; render();
    audio.volume = 0;
    try {
      await audio.play();
    } catch {
      playing = false;
      render(`Couldn't load ${TRACKS[index].src}`);
      return;
    }
    fadeTo(VOLUME, 2000);
  };

  const pause = async () => {
    playing = false; render();
    if (await fadeTo(0, 500)) audio.pause();
  };

  const next = async () => {
    const resume = playing;
    if (resume && !audio.paused) await fadeTo(0, 400);
    index = (index + 1) % TRACKS.length;
    load();
    resume ? play() : render();
  };

  playBtn.addEventListener('click', () => (playing ? pause() : play()));
  el('next').addEventListener('click', next);
  audio.addEventListener('ended', next);

  load();
  render();
})();
</script>
</body>
</html>
